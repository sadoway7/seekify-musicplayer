name: Publish to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.2.0) — overrides auto-increment. Use for minor/major bumps."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  validate-ca-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Community Apps XML
        # A bare & in a changelog bullet silently dropped Seekify from the
        # CA store once (3f1217b). Block that class for good.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout templates/*.xml ca_profile.xml
  build-and-push:
    needs: validate-ca-templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Branch/dispatch runs must never touch the image real users pull.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/seekify:latest
            ghcr.io/${{ github.repository_owner }}/seekify:${{ github.sha }}
  windows-installer:
    needs: [validate-ca-templates, build-and-push]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Pin the bundled rip tools. ffmpeg: BtbN GPL build (essentials);
      # yt-dlp: official standalone exe.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
      YTDLP_VERSION: "2026.10.26"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wails3 CLI + NSIS
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          choco install nsis --no-progress --version=3.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Download bundled rip tools
        shell: bash
        run: |
          mkdir -p build/windows/tools
          curl -fsSL "$FFMPEG_URL" -o /tmp/ffmpeg.zip
          unzip -j /tmp/ffmpeg.zip "*/bin/ffmpeg.exe" -d build/windows/tools
          curl -fsSL -o build/windows/tools/yt-dlp.exe \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp.exe"
          ls -la build/windows/tools

      - name: Compute version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versioning: 1.1.x — patch auto-increments from the latest
          # release; minor/major bumps happen only when a dispatch run
          # passes an explicit version. History is kept (no deletions).
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            LAST=$(gh release list --limit 1 --json tagName -q '.[0].tagName // ""' 2>/dev/null || echo "")
            if [[ "$LAST" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              V="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3]+1))"
            else
              V="1.1.0"
            fi
          fi
          echo "SEEKIFY_VERSION=$V" >> "$GITHUB_ENV"
          echo "version: $V"

      - name: Build installer
        shell: bash
        run: |
          wails3 task windows:package GOOS=windows INSTALL_SCOPE=user VERSION="$SEEKIFY_VERSION"
          cp "bin/seekify.exe" "seekify-windows-amd64.exe"
          mv bin/Seekify-Setup.exe .
          sha256sum Seekify-Setup.exe seekify-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Upload installer artifact (branch test runs)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Seekify-Setup
          path: |
            Seekify-Setup.exe
            seekify-windows-amd64.exe
            SHA256SUMS

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every push to main becomes its own kept release (1.1.x history).
          # The newest published release is what the in-app updater polls.
          gh release create "v$SEEKIFY_VERSION" \
            --title "Seekify $SEEKIFY_VERSION" \
            --notes "Windows build $SEEKIFY_VERSION from ${GITHUB_SHA:0:7} $(date -u +%Y-%m-%d). Download Seekify-Setup.exe, run it, and Seekify lives in your tray. The app updates itself from the newest release." \
            Seekify-Setup.exe seekify-windows-amd64.exe SHA256SUMS
          # Guard: if the create lands as a draft (seen once), publish it.
          gh release edit "v$SEEKIFY_VERSION" --draft=false
